name: Job discovery

on:
  schedule:
    # Once daily at approximately 08:00 IST (02:30 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-discovery
  cancel-in-progress: false

jobs:
  discover:
    # Pin the image so runner migrations do not change this workflow underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # PostgreSQL is preferred. Cache-backed SQLite keeps zero-credential test runs stateful.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///job_discovery.db' }}
      USE_SQLITE_CACHE: ${{ secrets.DATABASE_URL == '' }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: service-account.json
      SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      AUTO_SUBMIT_APPLICATIONS: ${{ vars.AUTO_SUBMIT_APPLICATIONS || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install ".[postgres]"
      - name: Restore cached SQLite database
        if: ${{ env.USE_SQLITE_CACHE == 'true' }}
        uses: actions/cache@v4
        with:
          path: job_discovery.db
          key: job-discovery-db-${{ github.run_id }}
          restore-keys: |
            job-discovery-db-
      - name: Show persistence mode
        run: |
          if [ "$USE_SQLITE_CACHE" = "true" ]; then
            echo "Using cache-backed SQLite. Configure DATABASE_URL for durable PostgreSQL storage."
          else
            echo "Using persistent DATABASE_URL storage."
          fi
      - name: Write Google credentials
        if: ${{ env.SERVICE_ACCOUNT_JSON != '' }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > service-account.json
      - name: Validate configuration
        run: job-discovery validate-config
      - name: Initialize database
        run: job-discovery init-db
      - name: Discover and rank jobs
        env:
          PYTHONUNBUFFERED: "1"
        run: job-discovery discover
      # Source discovery is useful maintenance, but it visits many company career pages and
      # must not prevent the already-verified sources above from being fetched each day.
      # Refreshed sources are picked up by the next scheduled run.
      - name: Refresh and validate public ATS sources for the next run
        continue-on-error: true
        run: job-discovery discover-sources
      - name: Generate fetched-job files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          job-discovery export-jobs --output fetched-jobs.csv --since-hours 24
          job-discovery report --output discovery-report.md --since-hours 24
          job-discovery prepare-applications --output application-queue.csv --since-hours 24
      - name: Install application browser
        if: ${{ env.AUTO_SUBMIT_APPLICATIONS == 'true' }}
        run: |
          python -m pip install ".[applications]"
          python -m playwright install --with-deps chromium
      - name: Apply to eligible jobs in report-first order
        if: ${{ env.AUTO_SUBMIT_APPLICATIONS == 'true' }}
        run: |
          test -f MamtaGupta2026.1.pdf || {
            echo "Resume file is required for application submission." >&2
            exit 1
          }
          job-discovery apply-from-files \
            --report discovery-report.md \
            --jobs fetched-jobs.csv \
            --resume MamtaGupta2026.1.pdf \
            --artifacts application-artifacts \
            --submit
      - name: Sync Google Sheets
        if: ${{ env.SERVICE_ACCOUNT_JSON != '' && env.GOOGLE_SHEETS_SPREADSHEET_ID != '' }}
        run: job-discovery sync-sheets
      - name: Upload fetched jobs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fetched-jobs-${{ github.run_number }}
          path: |
            fetched-jobs.csv
            discovery-report.md
            application-queue.csv
            application-artifacts/
          if-no-files-found: warn
          retention-days: 30
