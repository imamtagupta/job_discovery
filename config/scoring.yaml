weights:
  primary_alignment: 30
  architecture_skills: 20
  experience_seniority: 15
  domain_achievements: 15
  location_eligibility: 10
  compensation_evidence: 5
  freshness: 5
high_score_threshold: 80
review_score_threshold: 65
company_preferences:
  product_company_priority: 100
  other_company_priority: 50
application_priority_weights:
  resume_relevance: 0.60
  eligibility: 0.15
  freshness: 0.10
  company_preference: 0.15
hard_filters:
  # Discovery is intentionally limited to engineering roles matching the candidate's
  # Python/backend/platform/cloud/AI/full-stack/quantitative experience.
  engineering_title_markers: [engineer, engineering, developer, software, backend, platform, infrastructure, sre, site reliability, devops, data engineering, machine learning engineering, ai engineering]
  excluded_title_terms: [intern, internship, graduate, fresher, junior, qa engineer, sdet, test engineer, automation tester, tester, data analyst, business intelligence, data scientist, research scientist, mobile engineer, frontend engineer, front-end engineer, helpdesk, technical support, professional services consultant, customer solution architect, product manager, product management, project manager, program manager, technical program manager, sales, account executive, account manager, business development, customer success, customer support, recruiter, recruiting, human resources, hr, marketing, finance, legal, operations, administrative]
  overleveled_title_terms: [staff, principal, distinguished engineer, engineering manager, director of engineering]
  excluded_employment_types: [internship, contract-to-hire]
mandatory_markers: [required, requirements, must have, minimum qualifications, what you need]
preferred_markers: [preferred, nice to have, bonus, desirable]
