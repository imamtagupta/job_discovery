[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-discovery"
version = "0.1.0"
description = "Automated, explainable ATS job discovery and matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "gspread>=6,<7",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.7,<1"]

[project.scripts]
job-discovery = "job_discovery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_discovery", "src/discovery"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

